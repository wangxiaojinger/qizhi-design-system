name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install chart test browser
        run: pnpm exec playwright install --with-deps chrome
      - name: Run chart browser tests
        env:
          QIZHI_DOCS_BASE_URL: http://127.0.0.1:5173
        run: |
          pnpm dev --port 5173 --strictPort > "$RUNNER_TEMP/qizhi-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$QIZHI_DOCS_BASE_URL/" > /dev/null; then
              pnpm e2e chart- --workers=2
              exit $?
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qizhi-vite.log"
          exit 1
