name: Publish GitHub Packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@wangxiaojinger"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify both package versions are unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in qizhi-tokens qizhi-react; do
            version=$(node -p "require('./packages/$package/package.json').version")
            versions=$(npm view "@wangxiaojinger/$package" versions --json)
            node --input-type=module -e '
              const [name, version, versions] = process.argv.slice(1);
              if ([JSON.parse(versions)].flat().includes(version)) {
                throw new Error(name + "@" + version + " is already published");
              }
            ' "$package" "$version" "$versions"
          done
      - name: Publish design tokens
        run: pnpm --filter @wangxiaojinger/qizhi-tokens publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish React components
        run: pnpm --filter @wangxiaojinger/qizhi-react publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
