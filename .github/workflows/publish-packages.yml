name: Publish GitHub Packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@wangxiaojinger"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:validate
      - run: pnpm --filter @wangxiaojinger/qizhi-tokens validate
      - run: pnpm --filter @wangxiaojinger/qizhi-tokens test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Publish design tokens
        run: pnpm --filter @wangxiaojinger/qizhi-tokens publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish React components
        run: pnpm --filter @wangxiaojinger/qizhi-react publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
