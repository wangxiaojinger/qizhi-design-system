name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Pack and publish
        run: |
          set -euo pipefail
          for package in qizhi-tokens qizhi-react; do
            name="@wangxiaojinger/$package"
            version=$(node -p "require('./packages/$package/package.json').version")
            test "$GITHUB_REF_NAME" = "v$version"
            pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP"
          done
          for package in qizhi-tokens qizhi-react; do
            archive="$RUNNER_TEMP/wangxiaojinger-$package-${GITHUB_REF_NAME#v}.tgz"
            metadata="$RUNNER_TEMP/$package.json"
            status=$(curl -sS -o "$metadata" -w '%{http_code}' "https://registry.npmjs.org/@wangxiaojinger%2f$package/${GITHUB_REF_NAME#v}")
            case "$status" in
              200)
                expected=$(node -p "require(process.argv[1]).dist.integrity" "$metadata")
                actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
                test "$expected" = "$actual"
                ;;
              404) npm publish "$archive" --registry=https://registry.npmjs.org --access public ;;
              *) echo "npm returned HTTP $status for $package" >&2; exit 1 ;;
            esac
          done
